services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flashtix}
      POSTGRES_USER: ${POSTGRES_USER:-flashtix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flashtix}
    ports:
      - "5432:5432"
    volumes:
      - flashtix-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flashtix} -d ${POSTGRES_DB:-flashtix}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-flashtix}
      DB_USERNAME: ${POSTGRES_USER:-flashtix}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-flashtix}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  flashtix-postgres:

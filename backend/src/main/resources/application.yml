server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: flashtix-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flashtix}
    username: ${DB_USERNAME:flashtix}
    password: ${DB_PASSWORD:flashtix}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
